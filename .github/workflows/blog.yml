name: SynthRadar Weekly SEO Blog Generator

on:
  schedule:
    # Run once a week on Sundays at 10:00 AM UTC
    - cron: '0 10 * * 0'
  workflow_dispatch:

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate Blog Content
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python generate_blog.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "SynthRadar Blog Bot"
        git config --global user.email "bot@synthradar.com"
        git add blog.html
        # Only commit if there are changes
        git diff --staged --quiet || git commit -m "docs(blog): generate weekly SEO post"
        git push origin main
